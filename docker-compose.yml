services:
  # PostgreSQL (local development database)
  postgres:
    image: postgres:15-alpine
    container_name: vidyashaale-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-vidyashaale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vidyashaale}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidyashaale-network

  # Redis for Bull Queue (Notifications)
  redis:
    image: redis:7-alpine
    container_name: vidyashaale-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidyashaale-network

  # API Gateway
  gateway:
    profiles: ["containerized"]
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: vidyashaale-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth:8081
      - CLASS_SERVICE_URL=http://class:8082
      - MEETING_SERVICE_URL=http://meeting:8083
      - RESOURCE_SERVICE_URL=http://resource:8084
      - NOTIFICATION_SERVICE_URL=http://notification:8085
      - JWT_SECRET=${JWT_SECRET}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      - auth
      - class
      - meeting
      - resource
      - notification
    networks:
      - vidyashaale-network

  # Auth Service
  auth:
    profiles: ["containerized"]
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: vidyashaale-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8081
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vidyashaale}:${POSTGRES_PASSWORD:-vidyashaale_dev}@postgres:5432/${POSTGRES_DB:-vidyashaale}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY=1h
      - JWT_REFRESH_EXPIRY=7d
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@vidyashaale.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vidyashaale-network

  # Class Service
  class:
    profiles: ["containerized"]
    build:
      context: ./services/class
      dockerfile: Dockerfile
    container_name: vidyashaale-class
    ports:
      - "${CLASS_PORT:-8082}:8082"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8082
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vidyashaale}:${POSTGRES_PASSWORD:-vidyashaale_dev}@postgres:5432/${POSTGRES_DB:-vidyashaale}
      - MEETING_SERVICE_URL=http://meeting:8083
      - NOTIFICATION_SERVICE_URL=http://notification:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vidyashaale-network

  # Meeting Service
  meeting:
    profiles: ["containerized"]
    build:
      context: ./services/meeting
      dockerfile: Dockerfile
    container_name: vidyashaale-meeting
    ports:
      - "${MEETING_PORT:-8083}:8083"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8083
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
    networks:
      - vidyashaale-network

  # Resource Service
  resource:
    profiles: ["containerized"]
    build:
      context: ./services/resource
      dockerfile: Dockerfile
    container_name: vidyashaale-resource
    ports:
      - "${RESOURCE_PORT:-8084}:8084"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8084
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vidyashaale}:${POSTGRES_PASSWORD:-vidyashaale_dev}@postgres:5432/${POSTGRES_DB:-vidyashaale}
      - STORAGE_TYPE=${STORAGE_TYPE:-LOCAL}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-vidyashaale}
      - STORAGE_LOCAL_PATH=/data/uploads
      - INSFORGE_URL=${INSFORGE_URL}
      - INSFORGE_ANON_KEY=${INSFORGE_ANON_KEY}
      - MAX_FILE_SIZE=52428800
      - NOTIFICATION_SERVICE_URL=http://notification:8085
    volumes:
      - resource_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vidyashaale-network

  # Notification Service
  notification:
    profiles: ["containerized"]
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: vidyashaale-notification
    ports:
      - "${NOTIFICATION_PORT:-8085}:8085"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8085
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vidyashaale}:${POSTGRES_PASSWORD:-vidyashaale_dev}@postgres:5432/${POSTGRES_DB:-vidyashaale}
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@vidyashaale.com}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vidyashaale-network

  # Frontend
  frontend:
    profiles: ["containerized"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidyashaale-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REACT_APP_API_URL=${API_URL:-http://localhost:8080}
    depends_on:
      - gateway
    networks:
      - vidyashaale-network

volumes:
  postgres_data:
  redis_data:
  resource_uploads:

networks:
  vidyashaale-network:
    driver: bridge
